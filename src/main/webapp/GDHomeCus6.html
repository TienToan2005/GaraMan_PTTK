<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GaraMan - Trang chủ khách hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar" id="topbar"></div>
  <main>
    <div class="card">
      <h1>Trang chủ khách hàng</h1>
      <p class="sub" id="hello"></p>
      <ul class="menu">
        <li><span class="item off">Tìm kiếm dịch vụ (chưa triển khai)</span></li>
        <li><a href="GDSelectTime6.html" id="bookLink">Đặt lịch hẹn</a></li>
        <li><span class="item off">Đổi mật khẩu (chưa triển khai)</span></li>
      </ul>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script>
    requireRole('CUSTOMER').then(function (me) {
      document.getElementById('hello').textContent = 'Xin chào: ' + me.fullName;
    });
    document.getElementById('bookLink').addEventListener('click', function () {
      sessionStorage.removeItem('booking');
    });
  </script>
</body>
</html>
